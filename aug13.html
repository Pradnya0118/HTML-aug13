<!DOCTYPE html>

<html>
    <head>
        
        <title>Registration Page</title>
        
    </head>
    <body>
     <center><h1 style="color: purple">User Registration Page for Job</h1></center>
     <center>

     <form action="" method="get">

      <table cellpadding="8">

      <tr>
        <td>username: </td>
        <td><input type="text" name="username" placeholder="enter your name"></td>
      </tr>

      <tr>
        <td>Email: </td>
        <td><input type="text" name="Email" placeholder="enter your email"></td>
      </tr>


      <tr>
        <td>Phone Number: </td>
        <td><input type="tel" name="Phone number" placeholder="enter your phone number"></td>
      </tr>


      <tr>
        <td>Date of Birth: </td>
        <td><input type="date" name="DOB" placeholder="enter your DOB"></td>
      </tr>



       <tr>
        <td>Address: </td>
        <td><textarea name="address" rows="5" cols="20">enter your address</textarea></td>
       </tr>
       
       <tr>
        <td>Gender:</td>
        <td>
       Male: <input type="radio" name="gender" value="Male"> 
       Female: <input type="radio" name="gender" value="Female"> 
       Other: <input type="radio" name="gender" value="Other"> 
       </td>
      </tr>


      <tr>
        <td>Qualification:</td>
        <td>
       BE: <input type="radio" name="BE" id="">
       BTech: <input type="radio" name="BTech" id="">
       BCS:   <input type="radio" name="BCS" id="">
       BCA:   <input type="radio" name="BCA id="">
      </td>
      </tr>

      
      <tr>
        <td>Skills:</td>
        <td>
       Python: <input type="checkbox" name="python" id="">
       HTML: <input type="checkbox" name="HTML" id="">
       DA:   <input type="checkbox" name="DA" id="">
       DS:   <input type="checkbox" name="DS" id="">
      </td>
      </tr>


      <tr>
        <td>Country:</td>
        <td>
          <select name="country" id="">
         <option value="In">INDIA</option>
         <option value="US">US</option>
         <option value="UK">UK</option>
         <option value="Gr">Germany</option> 
       </select></td>
      </tr>

       
       <tr><td colspan="2" align="center"><button type="submit">Register</button></td></tr>

     </table>
     </form></center>
       
    </body>
</html>
